name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Offline tests (mocked Gemini, mocked Browserbase, no keys, no network)
        env:
          CONTACT_EMAIL: ci@example.com
        run: pytest -q tests_agent_mock.py tests_export.py tests_publisher.py tests_coverage.py
